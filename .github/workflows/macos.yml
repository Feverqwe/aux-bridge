name: macOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/cache@v5
        with:
          path: .local/qt/6.12.0
          key: qtbase-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/prepare-qt.sh') }}
      - name: Prepare tools
        run: |
          command -v pkg-config >/dev/null || brew install pkgconf
          command -v ninja >/dev/null || brew install ninja
          qt_prefix=$(./scripts/prepare-qt.sh)
          printf 'QT_PREFIX=%s\n' "$qt_prefix" >> "$GITHUB_ENV"
      - name: Check audio buffering
        run: ./scripts/test-audio.sh
      - name: Build and package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            ./scripts/release.sh --archive "$GITHUB_REF_NAME"
          else
            ./scripts/release.sh --archive
          fi
          codesign --verify --deep --strict 'build/Aux Bridge.app'
      - uses: actions/upload-artifact@v7
        with:
          name: aux-bridge-macos
          path: build/aux-bridge-*.zip
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: aux-bridge-macos
          path: release
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
